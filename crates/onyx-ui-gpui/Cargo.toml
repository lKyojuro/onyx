[workspace]

[package]
name = "onyx-ui-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Onyx Contributors"]
license = "MIT OR Apache-2.0"
description = "Standalone GPUI + gpui-fast next-gen UI prototype for Onyx"

[dependencies]
dirs = "7.0"
gpui-kit = { version = "0.11.0", features = ["gpui-fast"] }
onyx-core = { path = "../onyx-core" }
onyx-fs = { path = "../onyx-fs" }
rayon = "1.12"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "unwind"
