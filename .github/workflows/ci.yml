name: Onyx Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  windows-build-and-test:
    name: Windows x64 Build, Lint & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --locked --workspace

      - name: Build release binary
        run: cargo build --locked --release --bin onyx

      - name: Verify release binary (--version and --smoke-test)
        run: |
          .\target\release\onyx.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\target\release\onyx.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
