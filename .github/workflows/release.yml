name: Onyx Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  windows-release:
    name: Windows x64 Release Build & Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Verify Git tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $cargoToml = Get-Content .\Cargo.toml -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Could not parse workspace version from Cargo.toml"
          }
          $cargoVersion = $Matches[1]
          if ($tagVersion -ne $cargoVersion) {
            throw "Git tag version '$tagVersion' does not match Cargo.toml version '$cargoVersion'"
          }
          Write-Host "Verified tag v$tagVersion matches Cargo.toml version $cargoVersion"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run unit & integration tests
        run: cargo test --locked --workspace

      - name: Build release binary
        run: cargo build --locked --release --bin onyx

      - name: Verify release binary (--version and --smoke-test)
        run: |
          .\target\release\onyx.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\target\release\onyx.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable ZIP
        run: .\scripts\package-portable.ps1 -SkipBuild

      - name: Verify portable ZIP SHA-256 checksum
        run: |
          $expected = ((Get-Content .\dist\onyx-portable-win64.zip.sha256) -split '\s+' | Select-Object -First 1).ToUpperInvariant()
          $actual = (Get-FileHash .\dist\onyx-portable-win64.zip -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "SHA-256 mismatch: expected $expected, got $actual"
          }
          Write-Host "SHA-256 verified: $actual"

      - name: Install WiX Toolset v5
        run: dotnet tool install --global wix --version 5.*

      - name: Build WiX MSI installer
        run: .\scripts\package-wix.ps1 -SkipBuild -Require

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onyx-windows-x64-dist
          path: |
            dist/onyx-portable-win64.zip
            dist/onyx-portable-win64.zip.sha256
            dist/*.msi
            dist/*.msi.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/onyx-portable-win64.zip
            dist/onyx-portable-win64.zip.sha256
            dist/*.msi
            dist/*.msi.sha256
